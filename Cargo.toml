[package]
name = "lottery-miner"
version = "0.3.1"
edition = "2024"
description = "Windows tray app to run and watch a solo Bitcoin CPU miner and a home-server miner"
publish = false

# Exact pins; Cargo.lock is committed too.
[dependencies]
gpui = "=0.2.2"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tray-icon = "=0.26.1"
ureq = { version = "=2.12.1", features = ["json"] }

[profile.release]
lto = "thin"

[workspace]
members = [".", "gpu-miner"]
