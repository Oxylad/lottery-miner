<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256">
  <!-- Lottery Miner logo: icon plus wordmark. -->
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFC266"/>
      <stop offset="45%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#B85E00"/>
    </radialGradient>
    <radialGradient id="gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE6DC"/>
    </linearGradient>
  </defs>

  <g>
    <circle cx="128" cy="128" r="120" fill="url(#ball)"/>
    <circle cx="128" cy="128" r="119" fill="none" stroke="#8A4500" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="rotate(-14 128 132)">
      <circle cx="128" cy="132" r="70" fill="url(#disc)"/>
      <circle cx="128" cy="132" r="70" fill="none" stroke="#B85E00" stroke-opacity="0.25" stroke-width="3"/>
      <g fill="#1B1D22">
        <rect x="114" y="76" width="9" height="16" rx="2"/>
        <rect x="131" y="76" width="9" height="16" rx="2"/>
        <rect x="114" y="172" width="9" height="16" rx="2"/>
        <rect x="131" y="172" width="9" height="16" rx="2"/>
        <path d="M100 88 H145 C163 88 173 98 173 112 C173 122 167 129 158 132
                 C170 135 177 143 177 155 C177 171 165 176 148 176 H100 V162 H108 V102 H100 Z
                 M124 102 V125 H143 C152 125 156 121 156 113.5 C156 106 152 102 143 102 Z
                 M124 139 V162 H146 C155 162 160 158 160 150.5 C160 143 155 139 146 139 Z"
              fill-rule="evenodd"/>
      </g>
    </g>
    <ellipse cx="86" cy="66" rx="52" ry="30" transform="rotate(-30 86 66)" fill="url(#gloss)"/>
  </g>

  <text x="282" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="#F7931A" letter-spacing="-1">Lottery</text>
  <text x="282" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="#E6E6E6" letter-spacing="-1">Miner</text>
